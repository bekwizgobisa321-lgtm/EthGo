<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthioCal | Ethiopian to Gregorian Calendar Converter</title>

  <!-- Google Font used for the logo + card title -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- the nav-bar -->
<header class="site-header">
<a href="#" class="logo">
    <img src="assets/images/hero.jpg" alt="background-imge"
    <span class="logo-text">EthioCal</span>
</a>
 <nav class="main-nav">
      <ul>
        <li><a href="#converter">Converter</a></li>
        <li><a href="#calendar">Calendar</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
</header>
 <!-- ===== hero section with background image ===== -->
  <main class="hero">

    <!-- ===== CONVERTER CARD ===== -->
    <section class="converter-card" id="converter" aria-labelledby="converter-title">
      <h1 id="converter-title">Ethiopian ↔️ Gregorian Calendar Converter</h1>

      <div class="converter-columns">

        <!-- ETHIOPIAN DATE COLUMN -->
        <div class="date-column">
          <h2>Ethiopian Date</h2>
        <div class="field">
             <label for="eth-year">Year</label>
            <select id="eth-year" name="eth-year">
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018" selected>2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
            </select>
        </div>
        <div class="field">
             <label for="eth-month">Month</label>
              <select id="eth-month" name="eth-month">
              <option value="Meskerem">Meskerem</option>
              <option value="Tikimt">Tikimt</option>
              <option value="Hidar">Hidar</option>
              <option value="Tahsas">Tahsas</option>
              <option value="Tir">Tir</option>
              <option value="Yekatit">Yekatit</option>
              <option value="Megabit">Megabit</option>
              <option value="Miazia">Miazia</option>
              <option value="Ginbot">Ginbot</option>
              <option value="Sene">Sene</option>
              <option value="Hamle">Hamle</option>
              <option value="Nahase" selected>Nahase</option>
              <option value="Pagume">Pagume</option>
              </select>
        </div>
            <div class="field">
            <label for="eth-day">Day</label>
            <select id="eth-day" name="eth-day">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <!-- Remaining days can be generated dynamically later with JS -->
            </select>
          </div>
               <button type="button" class="convert-btn" id="convert-to-gregorian">Convert</button>
        </div>

        <!-- GREGORIAN DATE COLUMN -->
        <div class="date-column">
          <h2>Gregorian Date</h2>
            <div class="field">
            <label for="greg-year">Year</label>
            <select id="greg-year" name="greg-year">
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>

          <div class="field">
            <label for="greg-month">Month</label>
            <select id="greg-month" name="greg-month">
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August" selected>August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
          </div>
           <div class="field">
            <label for="greg-day">Day</label>
            <select id="greg-day" name="greg-day">
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7" selected>7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <!-- Remaining days can be generated dynamically later with JS -->
            </select>
          </div>
             <button type="button" class="convert-btn" id="convert-to-ethiopian">Convert</button>
        </div>

      </div>

      <!-- Result text — JS will update this element's content -->
      <p class="result" id="conversion-result">1 Nahase 2018 is August 7, 2026</p>
    </section>
  </main>
</body>
</html>
