<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthGo | Ethiopian to Gregorian Calendar Converter</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />

  <!-- Google Font used for the logo + card title -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- the nav-bar -->
<header class="site-header">
<a href="#" class="logo">
    <!-- <img src="assets/images/hero-b.jpg" alt="background-imge" -->
    <span class="logo-text">EthGo</span>
</a>
 <nav class="main-nav">
      <ul>
        <li><a href="#converter">Converter</a></li>
        <li><a href="#calendar">Calendar</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
</header>
 <!-- ===== hero section with background image ===== -->
  <main class="hero">

    <!-- ===== CONVERTER CARD ===== -->
    <section class="converter-card" id="converter" aria-labelledby="converter-title">
      <h1 id="converter-title">Ethiopian ↔️ Gregorian Calendar Converter</h1>

      <div class="converter-columns">

        <!-- ETHIOPIAN DATE COLUMN -->
        <div class="date-column">
          <h2>Ethiopian Date</h2>
        <div class="field">
             <label for="eth-year">Year</label>
            <!-- Options are generated in JS — see initDropdowns() in index.js -->
            <select id="eth-year" name="eth-year"></select>
        </div>
        <div class="field">
             <label for="eth-month">Month</label>
              <select id="eth-month" name="eth-month"></select>
        </div>
            <div class="field">
            <label for="eth-day">Day</label>
            <select id="eth-day" name="eth-day"></select>
          </div>
               <button type="button" class="convert-btn" id="convert-to-gregorian">Convert</button>
        </div>

        <!-- GREGORIAN DATE COLUMN -->
        <div class="date-column">
          <h2>Gregorian Date</h2>
            <div class="field">
            <label for="greg-year">Year</label>
            <!-- Options are generated in JS — see initDropdowns() in index.js -->
            <select id="greg-year" name="greg-year"></select>
          </div>

          <div class="field">
            <label for="greg-month">Month</label>
            <select id="greg-month" name="greg-month"></select>
          </div>
           <div class="field">
            <label for="greg-day">Day</label>
            <select id="greg-day" name="greg-day"></select>
          </div>
             <button type="button" class="convert-btn" id="convert-to-ethiopian">Convert</button>
        </div>

      </div>
      <!-- Result text — JS will update this element's content -->
      <p class="result" id="conversion-result">1 Nahase 2018 is August 7, 2026</p>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
